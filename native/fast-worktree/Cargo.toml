[package]
name = "neuronest-native-fast-worktree"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
description = "Native-speed git worktree operations for NeuroNest Ultra execution mode"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["napi6", "serde"] }
napi-derive = "2"
serde = { version = "1", features = ["derive"] }
git2 = "0.19"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
