# NeuroNest Cloud Agent — Kubernetes Deployment Configuration
#
# Task 22.4

apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuronest-cloud-agent
  namespace: neuronest
  labels:
    app: neuronest-cloud
    tier: cloud-agent
    feature-flag: cloud_agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: neuronest-cloud
  template:
    metadata:
      labels:
        app: neuronest-cloud
        tier: cloud-agent
        plan-tier: professional
    spec:
      serviceAccountName: neuronest-cloud
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: neuronest-cloud
          image: neuronest/cloud-agent:latest
          ports:
            - containerPort: 3100
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3100"
            - name: FEATURE_CLOUD_AGENT
              value: "true"
            - name: ENFORCE_FIREWALL
              value: "true"
            - name: ENFORCE_ACTION_ANALYZER
              value: "true"
            - name: ENFORCE_NETWORK_SANDBOX
              value: "true"
            - name: PLAN_TIER_REQUIRED
              value: "professional"
          envFrom:
            - secretRef:
                name: neuronest-cloud-secrets
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 3100
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3100
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
---
apiVersion: v1
kind: Service
metadata:
  name: neuronest-cloud-agent
  namespace: neuronest
spec:
  selector:
    app: neuronest-cloud
  ports:
    - port: 80
      targetPort: 3100
      protocol: TCP
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: neuronest-cloud-network-policy
  namespace: neuronest
spec:
  podSelector:
    matchLabels:
      app: neuronest-cloud
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress
      ports:
        - protocol: TCP
          port: 3100
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: neuronest
      ports:
        - protocol: TCP
          port: 443
    # Allow DNS
    - to: []
      ports:
        - protocol: UDP
          port: 53
