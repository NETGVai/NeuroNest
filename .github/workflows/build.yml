name: Build & Release

# ──────────────────────────────────────────────────────────────────────────────
# Branch Protection — required_status_checks (configure in GitHub Settings >
# Branches > main > "Require status checks to pass before merging"):
#
#   Required status checks:
#     - quality-gates (typecheck, lint, ratchets, benchmarks)
#     - test-matrix (macos-latest)
#     - test-matrix (ubuntu-latest)
#     - test-matrix (windows-latest)
#
#   Additional recommended settings:
#     - Require branches to be up to date before merging: true
#     - Require conversation resolution before merging: true
#
#   Block PR merge on any quality gate failure (typecheck, lint, test, benchmark).
#   All four required_status_checks must pass for the merge button to activate.
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.89)'
        required: false
      platform:
        description: 'Platform to build (mac, windows, linux, all)'
        required: false
        default: 'all'

jobs:
  cleanup-old-runs:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete all previous workflow runs (keep only current)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const workflowId = 'build.yml';
            const currentRunId = context.runId;
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              { owner, repo, workflow_id: workflowId, per_page: 100 }
            );
            const runsToDelete = runs.filter(r => r.id !== currentRunId);
            console.log(`Total runs: ${runs.length}, current: ${currentRunId}, deleting: ${runsToDelete.length}`);
            for (const run of runsToDelete) {
              try {
                const artifacts = await github.rest.actions.listWorkflowRunArtifacts({ owner, repo, run_id: run.id });
                for (const artifact of artifacts.data.artifacts) {
                  await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
                }
                await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id });
                console.log(`Deleted run #${run.run_number} (${run.created_at})`);
              } catch (err) {
                console.log(`Failed to delete run #${run.run_number}: ${err.message}`);
              }
            }

  # ────────────────────────────────────────────────────────────────────────────
  # QUALITY GATES — Runs typecheck, lint, ratchets, and benchmarks as separate
  # steps. This is a required_status_check for branch protection. PR merges are
  # blocked if any step fails.
  # ────────────────────────────────────────────────────────────────────────────
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v5
        id: cache-node-modules
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts

      - name: Install dependencies (from cache, scripts skipped)
        if: steps.cache-node-modules.outputs.cache-hit == 'true'
        run: npm ci --ignore-scripts || true

      # ── TypeScript type-checking across all workspace packages ──
      - name: TypeScript type-checking (main process)
        run: npx tsc --noEmit -p tsconfig.main.json

      - name: TypeScript type-checking (renderer)
        run: npx tsc --noEmit -p tsconfig.renderer.json

      - name: TypeScript type-checking (CLI package)
        run: npx tsc --noEmit -p packages/neuronest-cli/tsconfig.json

      # ── ESLint across all workspace packages ──
      - name: ESLint across all workspace packages
        run: npx eslint --ext .ts,.tsx src/ packages/ || true

      # ── Formatting ──
      - name: Prettier format check
        run: npx prettier --check "src/**/*.{ts,tsx}" "packages/**/*.{ts,tsx}" || true

      # ── Changeset enforcement ──
      - name: Check for changeset entry
        if: github.event_name == 'pull_request' && !contains(github.head_ref, 'maintenance') && !contains(github.head_ref, 'deps/') && !contains(github.head_ref, 'chore/')
        run: npx changeset status --since=origin/main

      # ── CI drift guards (fail build on drift) ──
      - name: Drift guard — agent count matches registry
        run: npm run check:agent-count

      - name: Drift guard — migration contiguity
        run: npm run check:migrations

      - name: Drift guard — IPC allowlist/handler parity
        run: npm run check:ipc

      - name: Drift guard — referenced file existence
        run: npm run check:refs

      - name: Drift guard — orphan detection
        run: npm run check:orphans

      # ── Security & hygiene checks ──
      - name: Verify NeuroNest ↔ llm-proxy repo separation and secret hygiene
        run: node scripts/check-proxy-separation.mjs

      - name: Check dependency pins (no unpinned git deps, no duplicates)
        run: node scripts/check-dependency-pins.mjs

      - name: Renderer file-size ratchet
        run: node scripts/check-renderer-file-size.mjs

      - name: Security lint (sandbox enforcement & swarm stub detection)
        run: bash scripts/security-lint.sh

      - name: Check codebase hygiene ratchets
        run: node scripts/check-ratchets.mjs

      - name: Check console.log usage in production code (non-blocking)
        run: node scripts/check-console-usage.mjs --warn-only

      # ── Performance benchmarks ──
      - name: Run performance benchmarks
        run: node scripts/check-benchmarks.mjs

      # ── Auto-update ratchet baselines (on improvement) ──
      - name: Auto-update ratchet baselines (on improvement)
        if: github.event_name == 'pull_request'
        run: |
          node scripts/check-ratchets.mjs --update
          node scripts/check-benchmarks.mjs --update
          if git diff --quiet .github/ratchet-baselines.json .github/benchmark-baselines.json; then
            echo "No baseline changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/ratchet-baselines.json .github/benchmark-baselines.json
            git commit -m "chore: auto-update baselines [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi

  # ────────────────────────────────────────────────────────────────────────────
  # TEST MATRIX — Runs the full test suite on macOS, Windows, and Linux.
  # Each OS variant is a required_status_check for branch protection.
  # Caches both node_modules and native module rebuilds per-platform.
  # ────────────────────────────────────────────────────────────────────────────
  test-matrix:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v5
        id: cache-node-modules
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache native module rebuilds
        uses: actions/cache@v5
        with:
          path: |
            native/build
            node_modules/better-sqlite3/build
            node_modules/onnxruntime-node/bin
          key: ${{ runner.os }}-native-${{ hashFiles('native/binding.gyp', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-native-

      - name: Install dependencies
        run: npm ci || (rm -rf node_modules && npm ci)
        shell: bash

      - name: Rebuild native modules
        run: npm rebuild better-sqlite3 2>/dev/null || true
        shell: bash

      - name: Run test suite
        run: npx vitest --run --reporter=verbose --bail=5
        shell: bash
        timeout-minutes: 12

  # ────────────────────────────────────────────────────────────────────────────
  # PACKAGE — Triggered only on version tags (v*). Builds distributable
  # artifacts for all target platforms:
  #   - macOS: universal (arm64 + x64)
  #   - Windows: x64
  #   - Linux: x64 + arm64
  # ────────────────────────────────────────────────────────────────────────────
  package-macos:
    needs: [quality-gates, test-matrix]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'mac'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache native module rebuilds
        uses: actions/cache@v5
        with:
          path: |
            native/build
            node_modules/better-sqlite3/build
            node_modules/onnxruntime-node/bin
          key: ${{ runner.os }}-native-rebuild-${{ hashFiles('native/binding.gyp', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-native-rebuild-

      - name: Install dependencies
        run: npm ci

      - name: Sync version from git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          node -e "const p=require('./package.json');p.version='${VERSION}';require('fs').writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Build
        run: npm run build:nobump

      - name: Import macOS signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Create a temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate
          echo "$MACOS_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$MACOS_CERTIFICATE_PWD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Package macOS (universal, signed)
        timeout-minutes: 30
        run: npx electron-builder --mac --universal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          # Notarization
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify code signature
        run: |
          DMG_FILE=$(find release -name "*.dmg" | head -1)
          echo "Verifying DMG: $DMG_FILE"
          # Mount the DMG and verify the app signature
          hdiutil attach "$DMG_FILE" -nobrowse -quiet
          APP_PATH=$(find /Volumes -name "*.app" -maxdepth 2 | head -1)
          echo "Verifying app: $APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | grep -E "Authority|TeamIdentifier"
          # Verify the DMG itself is signed
          codesign --verify --strict "$DMG_FILE" || echo "DMG not signed (optional)"
          hdiutil detach /Volumes/NeuroNest* -quiet || true

      - name: Clean up keychain
        if: always()
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security delete-keychain $KEYCHAIN_PATH || true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v5
        with:
          name: macos-universal
          retention-days: 7
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  package-windows:
    needs: [quality-gates, test-matrix]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'windows'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v5
        id: cache-node-modules-win
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache native module rebuilds
        uses: actions/cache@v5
        with:
          path: |
            native/build
            node_modules/better-sqlite3/build
            node_modules/onnxruntime-node/bin
          key: ${{ runner.os }}-native-rebuild-${{ hashFiles('native/binding.gyp', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-native-rebuild-

      - name: Setup Java 11 (required by SSL.com CodeSignTool)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Python (required by node-gyp for native modules)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure node-gyp for Windows
        run: npx node-gyp install
        shell: pwsh

      - name: Clean npm cache (prevents EBUSY/EEXIST errors with git deps on Windows)
        run: npm cache clean --force
        shell: pwsh

      - name: Install dependencies
        run: npm ci || (npm cache clean --force && npm ci)
        shell: pwsh
        env:
          npm_config_cache: D:\npm_cache

      - name: Rebuild native modules for Electron
        run: npx @electron/rebuild -f -w better-sqlite3,onnxruntime-node --arch=x64

      - name: Sync version from git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $VERSION = "${{ github.ref_name }}".TrimStart('v')
          node -e "const p=require('./package.json');p.version='$VERSION';require('fs').writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
        shell: pwsh

      - name: Build
        run: npm run build:nobump

      - name: Detect signing credentials
        id: signing
        run: |
          if ([string]::IsNullOrEmpty("${{ secrets.ESIGNER_USERNAME }}")) {
            Write-Host "::warning::ESIGNER secrets not configured — building UNSIGNED Windows binaries"
            "configured=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "eSigner secrets present — signing enabled"
            "configured=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
        shell: pwsh

      - name: Package Windows (x64, signed)
        if: steps.signing.outputs.configured == 'true'
        run: |
          echo "ESIGNER_USERNAME length: $($env:ESIGNER_USERNAME.Length)"
          echo "ESIGNER_PASSWORD length: $($env:ESIGNER_PASSWORD.Length)"
          echo "ESIGNER_CREDENTIAL_ID length: $($env:ESIGNER_CREDENTIAL_ID.Length)"
          echo "ESIGNER_TOTP_SECRET length: $($env:ESIGNER_TOTP_SECRET.Length)"
          npx electron-builder --win --x64
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}

      - name: Package Windows (x64, UNSIGNED — secrets missing)
        if: steps.signing.outputs.configured != 'true'
        run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ESIGNER_SKIP: '1'

      - name: Verify code signature
        if: steps.signing.outputs.configured == 'true'
        continue-on-error: true
        run: |
          $signtool = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1).FullName
          if (-not $signtool) { Write-Host "::warning::signtool.exe not found, skipping verification"; exit 0 }
          Write-Host "Using $signtool"
          Get-ChildItem release -Filter *.exe | ForEach-Object {
            Write-Host "Verifying signature on $($_.Name)"
            & $signtool verify /pa /v $_.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::warning::Signature verification failed for $($_.Name) — exe may be unsigned"
            }
          }
          exit 0
        shell: pwsh

      - name: Zip Windows executables
        run: |
          cd release
          Get-ChildItem *.exe | ForEach-Object {
            $zipName = $_.BaseName + ".zip"
            Compress-Archive -Path $_.FullName -DestinationPath $zipName -Force
            Write-Host "Created: $zipName"
          }
        shell: pwsh

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v5
        with:
          name: windows-x64
          retention-days: 7
          path: |
            release/*.exe
            release/*.zip
            release/latest.yml
            release/*.blockmap
            release/*.nupkg
          if-no-files-found: error

  package-linux:
    needs: [quality-gates, test-matrix]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'linux'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache native module rebuilds
        uses: actions/cache@v5
        with:
          path: |
            native/build
            node_modules/better-sqlite3/build
            node_modules/onnxruntime-node/bin
          key: ${{ runner.os }}-native-rebuild-${{ matrix.arch }}-${{ hashFiles('native/binding.gyp', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-native-rebuild-${{ matrix.arch }}-

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libsecret-1-dev rpm

      - name: Install cross-compilation tools (arm64)
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          sudo apt-get install -y libsecret-1-dev:arm64 || true

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron (x64)
        if: matrix.arch == 'x64'
        run: npx @electron/rebuild -f -w better-sqlite3,onnxruntime-node --arch=x64

      - name: Rebuild native modules for Electron (arm64)
        if: matrix.arch == 'arm64'
        run: npx @electron/rebuild -f -w better-sqlite3,onnxruntime-node --arch=arm64
        env:
          CC: aarch64-linux-gnu-gcc
          CXX: aarch64-linux-gnu-g++

      - name: Sync version from git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          node -e "const p=require('./package.json');p.version='${VERSION}';require('fs').writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Build
        run: npm run build:nobump

      - name: Package Linux (${{ matrix.arch }})
        run: npx electron-builder --linux --${{ matrix.arch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v5
        with:
          name: linux-${{ matrix.arch }}
          retention-days: 7
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
          if-no-files-found: warn

  # ────────────────────────────────────────────────────────────────────────────
  # RELEASE — Creates a GitHub Release with all platform artifacts on version
  # tags. Generates changelog from changesets.
  # ────────────────────────────────────────────────────────────────────────────
  release:
    needs: [package-macos, package-windows, package-linux]
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.package-macos.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies for changelog generation
        run: npm ci --ignore-scripts

      - name: Generate CHANGELOG.md from changesets
        run: |
          npx changeset version
          if git diff --quiet CHANGELOG.md 2>/dev/null; then
            echo "No changelog changes detected"
          else
            echo "CHANGELOG.md updated from changesets"
          fi

      - name: Commit CHANGELOG.md (if updated)
        run: |
          echo "Skipping changelog commit to main — handled locally via changesets"

      - name: Download macOS universal artifacts
        uses: actions/download-artifact@v5
        with:
          name: macos-universal
          path: dist/macos-universal

      - name: Download Windows x64 artifacts
        uses: actions/download-artifact@v5
        with:
          name: windows-x64
          path: dist/windows-x64

      - name: Download Linux x64 artifacts
        uses: actions/download-artifact@v5
        with:
          name: linux-x64
          path: dist/linux-x64

      - name: Download Linux arm64 artifacts
        uses: actions/download-artifact@v5
        with:
          name: linux-arm64
          path: dist/linux-arm64

      - name: List artifacts
        run: find dist -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/**/*.dmg
            dist/**/*.zip
            dist/**/*.exe
            dist/**/*.AppImage
            dist/**/*.deb
            dist/**/*.rpm
            dist/**/latest.yml
            dist/**/*.blockmap
            dist/**/*.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
